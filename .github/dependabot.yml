# Dependency updates once a week; minor and patch updates go in one PR per ecosystem, major ones separately.
# Action versions are pinned by SHA with a "# vX.Y.Z" comment: Dependabot updates both the SHA and the comment.
# Every ecosystem has `cooldown.default-days: 14`: Dependabot does not offer a version younger than two weeks
# (project rule from ADR-0007 and ADR-0009, recorded in ADR-0012). Cooldown applies to version updates only, not security updates.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      cargo-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    # @playwright/test must match the version of the mcr.microsoft.com/playwright:vX-noble image in ci.yml and visual-update.yml,
    # and Dependabot does not update the image in the workflow: the version is changed by hand, together with the image.
    ignore:
      - dependency-name: "@playwright/test"
    groups:
      npm-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # github-actions supports only default-days (no semver-*-days keys).
    cooldown:
      default-days: 14
    groups:
      actions-minor-patch:
        update-types: [minor, patch]
