# CI on every PR and push to main (GitHub Actions): Linux runners, and the macOS app code on macos-15 (job `macos`).
# Windows (slice 10a) runs on windows-2025 (job `windows`).
# Building and signing the .app is local: scripts/build-app.sh; shots of the real window are screens.yml (macOS runner).
name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Bot commits from visual-update.yml and screens.yml are made by GITHUB_TOKEN and do not start CI by themselves: those workflows call
  # `gh workflow run ci.yml` (workflow_dispatch by GITHUB_TOKEN does start). It can also be run by hand.
  workflow_dispatch:

# Default permissions are read-only; no job needs more.
permissions:
  contents: read

# Line tables instead of full debug info in test builds: backtraces keep file and line, and the target stays far smaller. With full
# debug info the target was 21 GB, and runners on the ubuntu-24.04 image 20261101.114 ran out of space linking the app test binaries:
# `No space left on device` and ld SIGBUS (signal 7) in `rust` and `coverage` (PR #45; 20261025.353 and 20261101.360 passed).
env:
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

# The runner is pinned: ubuntu-latest is moving to Ubuntu 26, and the WebKitGTK package names there are not verified.
jobs:
  rust:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      # Headroom on the disk (see `env` above): the preinstalled Android SDK, .NET and GHC are not used here (about 20 GB).
      - name: Free disk space
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup

      # Tauri system libraries on Linux (wry/WebKitGTK).
      - name: Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential curl pkg-config libssl-dev \
            libwebkit2gtk-4.1-dev libxdo-dev libayatana-appindicator3-dev librsvg2-dev

      # The version and components come from rust-toolchain.toml; rustup is already on the GitHub runner.
      - name: Rust toolchain
        run: rustup toolchain install

      # The cache is saved only on main: branches and PRs read it (restoring from the main cache) but do not write it,
      # otherwise every PR takes space in the 10 GB limit and evicts the main cache.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      # Argon2id of profiles 1 and 2 on this runner (S4b, ADR-0001 decision 8); informational, the numbers go to the log.
      - name: Argon2id timing and peak memory
        run: |
          cargo run --release -p kinige-crypto --example measure_kdf -- 1 5
          cargo run --release -p kinige-crypto --example measure_kdf -- 2 1
      # The screens driver (KINIG-92, ADR-0016) is a cargo feature that is off by default: build and test it here so the gated code does not
      # rot, and prove that the build is refused without the allow variable (the message is build.rs's).
      - name: Screens driver feature (clippy and tests, with the allow variable)
        env:
          KINIGE_ALLOW_SCREENS_DRIVER: "1"
        run: |
          cargo clippy -p kinige --features screens-driver --all-targets -- -D warnings
          cargo test -p kinige --features screens-driver
      - name: Screens driver feature is refused without the allow variable
        run: |
          if cargo check -p kinige --features screens-driver > driver-refusal.log 2>&1; then
            echo "the screens-driver feature built without KINIGE_ALLOW_SCREENS_DRIVER=1"
            exit 1
          fi
          grep -F "refusing to build it without KINIGE_ALLOW_SCREENS_DRIVER=1" driver-refusal.log
          rm driver-refusal.log
      - name: kinige-domain for wasm32
        run: cargo build -p kinige-domain --target wasm32-unknown-unknown
      # The tests' hooks (KINIG-103) are the cargo feature `test-hooks` of `kinige-store` and `kinige`; only the crates' own dev-dependencies turn it on.
      # The first step compiles what a build for people compiles (libraries and binaries, no dev-dependencies) with warnings denied; the second proves
      # that the release dependency graph does not have the feature, and that the check fails when the feature is forced on.
      - name: Without the test hooks (clippy of the code a build for people compiles)
        run: cargo clippy --workspace --lib --bins -- -D warnings
      - name: Release graph has no test hooks
        run: |
          bash scripts/check-release-features.sh
          bash scripts/check-release-features.test.sh
      # `cargo test` above regenerated the TS types (ts-rs) and the year tables for the forest stories (slice 6, crates/kinige-domain/tests/forest_fixtures.rs);
      # any difference from what is committed, including new untracked files, fails the job (`git diff` does not see them).
      - name: Generated TS types and forest tables are up to date
        run: |
          changed="$(git status --porcelain -- web/src/api/generated web/src/ui/forest/fixtures)"
          if [ -n "$changed" ]; then
            echo "$changed"
            exit 1
          fi

  # Code under `#[cfg(target_os = "macos")]` (the NSPanel, the tray, the settings window) and the src-tauri IPC tests on a real macOS:
  # this code does not compile on Linux. Only the app crate; the rest is checked by `rust`.
  macos:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Rust toolchain
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - run: cargo clippy -p kinige -p kinige-crypto --all-targets -- -D warnings
      - run: cargo test -p kinige -p kinige-crypto
      # Argon2id of profiles 1 and 2 on this runner (S4b, ADR-0001 decision 8), by hand only: `gh workflow run ci.yml --ref <branch>`. It costs
      # about 2.5 runner-minutes, and the `rust` job measures it on every run.
      - name: Argon2id timing and peak memory
        if: github.event_name == 'workflow_dispatch'
        run: |
          cargo run --release -p kinige-crypto --example measure_kdf -- 1 5
          cargo run --release -p kinige-crypto --example measure_kdf -- 2 1
      # The screens driver on the platform it runs on (clippy only; `rust` builds and tests it on Linux).
      - name: Screens driver feature (clippy)
        env:
          KINIGE_ALLOW_SCREENS_DRIVER: "1"
        run: cargo clippy -p kinige --features screens-driver --all-targets -- -D warnings

  # Windows (slice 10a): the app crate and the three crates it stands on. MCP is Unix-only and is compiled out there; the
  # tests that need Unix sockets, modes, symlinks or signals are gated with `#[cfg(unix)]`. The runner is pinned like the
  # others: `windows-latest` moves to a new image without notice. Everything else (fmt, wasm32, generated TS types,
  # cargo-deny) is platform independent and stays in `rust`.
  windows:
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Rust toolchain
        run: rustup toolchain install

      # The cache is saved on main only, like in the other jobs: branches and PRs restore it but do not write.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - run: cargo clippy -p kinige -p kinige-store -p kinige-domain -p kinige-mcp -p kinige-crypto --all-targets -- -D warnings
      # --no-fail-fast: one run lists every failing test binary, a Windows run is too slow to find them one by one.
      - run: cargo test --no-fail-fast -p kinige -p kinige-store -p kinige-domain -p kinige-mcp -p kinige-crypto
      # Argon2id of profiles 1 and 2 on this runner (S4b, ADR-0001 decision 8), by hand only: `gh workflow run ci.yml --ref <branch>`. It costs
      # about 2.5 runner-minutes, and the `rust` job measures it on every run.
      - name: Argon2id timing and peak memory
        if: github.event_name == 'workflow_dispatch'
        run: |
          cargo run --release -p kinige-crypto --example measure_kdf -- 1 5
          cargo run --release -p kinige-crypto --example measure_kdf -- 2 1
      # The screens driver runs on this platform too (clippy only).
      - name: Screens driver feature (clippy)
        env:
          KINIGE_ALLOW_SCREENS_DRIVER: "1"
        run: cargo clippy -p kinige --features screens-driver --all-targets -- -D warnings

  # Rust coverage -> Codecov (badges in the README, a comment in the PR). Informational: the threshold does not fail CI (codecov.yml).
  # A separate job: the instrumented build (cargo llvm-cov) does not share artifacts with `rust` and runs in parallel with it.
  # The web coverage is taken in the `web` job by the same vitest run as the check.
  coverage:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Free disk space
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup

      - name: Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential curl pkg-config libssl-dev \
            libwebkit2gtk-4.1-dev libxdo-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Rust toolchain
        run: |
          rustup toolchain install
          rustup component add llvm-tools-preview

      # The cache is saved only on main: branches and PRs read it (restoring from the main cache) but do not write it,
      # otherwise every PR takes space in the 10 GB limit and evicts the main cache.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68 # v2.88.1
        with:
          tool: cargo-llvm-cov@0.9.1

      # Test modules inside src/ (`tests.rs`, `*_tests.rs`, `tests_*.rs`) are not part of the coverage; llvm-cov drops the tests/ directories itself.
      - name: Rust coverage
        run: >-
          cargo llvm-cov --workspace --lcov --output-path lcov-rust.info
          --ignore-filename-regex '(^|/)(tests|[a-z0-9_]+_tests|tests_[a-z0-9_]+|[a-z0-9_]+_tests_[a-z0-9_]+)\.rs$'

      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: lcov-rust.info
          flags: rust
          disable_search: true
          fail_ci_if_error: false

  web:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: tokens.css and themes.css are up to date
        run: |
          npm run tokens
          changed="$(git status --porcelain -- src/ui/tokens.css src/ui/themes.css)"
          if [ -n "$changed" ]; then
            echo "$changed"
            exit 1
          fi
      - name: Shot scenario helpers (an empty window dump is an error)
        working-directory: .
        run: bash scripts/screens/lib.test.sh
      - name: Test hooks guard (a build with the runners' fake microphone or screens driver must fail)
        working-directory: .
        run: bash scripts/check-test-hooks.test.sh
      # The agents' harness (KINIG-110): the tool-call guard and the pre-PR check, each case with its exact exit code.
      - name: Agent harness guard and pre-PR check
        working-directory: .
        run: |
          python3 -I .claude/hooks/tests/test_hooks.py
          python3 -I scripts/pre-pr-check.test.py
      - run: npm run typecheck
      - run: npm run lint
      # Tests and coverage in one vitest run; the report goes to Codecov (flag web), an upload failure does not fail CI.
      - run: npm run test:coverage
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: web/coverage/lcov.info
          flags: web
          disable_search: true
          fail_ci_if_error: false

  visual:
    runs-on: ubuntu-24.04
    # The same image as in visual-update.yml: baselines are captured in the same environment.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - run: npm ci
      - run: npm run build-storybook
      - run: npx playwright test
      # Shot mismatches (expected, actual and the diff) stay in the run: a flaky shot can be analyzed from the images.
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: visual-test-results
          path: web/test-results
          if-no-files-found: ignore

  # Licenses, known vulnerabilities (RustSec) and crate sources: deny.toml.
  deny:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      # cargo-deny calls `cargo metadata`: the Rust version comes from rust-toolchain.toml.
      - name: Rust toolchain
        run: rustup toolchain install

      - uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68 # v2.88.1
        with:
          tool: cargo-deny@0.20.2

      - run: cargo deny check advisories licenses sources
      # The simulation spike is a crate outside the workspace (S4a); its test tooling (proptest) is held to the same rules.
      - run: cargo deny --manifest-path spikes/S4a-sync/Cargo.toml --config deny.toml check advisories licenses sources
      # The account-flow spike (S4b) is outside the workspace too; it adds only kinige-crypto, which the first command covers.
      - run: cargo deny --manifest-path spikes/S4b-keys/Cargo.toml --config deny.toml check advisories licenses sources

  # Spike S4b (KINIG-96): the account flows of ADR-0001 §8 against an in-memory server with the real keys, wraps and envelopes of
  # `kinige-crypto`, `spikes/S4b-keys`, a crate outside the workspace. Node is here for libsodium.js: the committed vectors must be those it
  # makes now (`npm run check`) and what Rust seals must open in it (`S4B_NODE=1`, tests/js_interop.rs).
  s4b:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Rust toolchain
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: spikes/S4b-keys
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - name: The committed vectors are what libsodium.js makes
        working-directory: spikes/S4b-keys/vectors
        run: |
          npm ci --user-agent=kinige-dev
          npm run check

      - name: Account flows, crashes and lost answers, logs, interop with libsodium.js
        working-directory: spikes/S4b-keys
        env:
          S4B_NODE: "1"
        run: cargo test

  # Spike S4a (KINIG-94): the simulation of the sync protocol, `spikes/S4a-sync`, a crate outside the workspace so no job above builds
  # it. Fixed seed and a smaller number of cases keep the job short; plain `cargo test` there runs 10 000 cases per property for 2
  # devices and 2 000 for 3, and takes about 20 s once built. The negative controls (a switch that breaks a rule must make a property fail) run
  # here too, so the properties keep their teeth.
  s4a:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Rust toolchain
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: spikes/S4a-sync
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Simulation, properties and negative controls
        working-directory: spikes/S4a-sync
        env:
          S4A_CASES: "1000"
          S4A_CASES3: "200"
          S4A_CONTROL_CASES: "3000"
          S4A_SEED: "1"
        # Not `tests/stats.rs`: it prints coverage numbers, asserts nothing and takes 11 s.
        run: cargo test --test properties --test negative --test scenarios

      # The same properties and controls with every envelope sealed and opened by `kinige-crypto` and the revision ids from the real keyed
      # hash (S4b, KINIG-96, feature `real-envelope`): the protocol and the bytes proven together, at a small fixed count.
      - name: Simulation with real envelopes
        working-directory: spikes/S4a-sync
        env:
          S4A_CASES: "500"
          S4A_CASES3: "100"
          S4A_CONTROL_CASES: "3000"
          S4A_SEED: "1"
        run: cargo test --features real-envelope --test properties --test negative --test scenarios --test real_envelope

  # Spike S4c-1 (KINIG-98): the sync server core, `server/`, against a real Postgres 17 (a service container, pinned by digest). The
  # `pg-tests` suites make a database per test and drop it: the HTTP API, push and pull with every answer of ADR-0001 §A.3, parallel pushers
  # with a puller (the cursor skips nothing) and its negative control, compaction on the injected clock, the plain-text scan of every table and
  # the log, and garbage on every endpoint. Then the S4a simulation with every device talking to this server through its router
  # (`real-server`, a small fixed count). `cargo test --workspace` in `rust` needs no database and runs the pure rules only. The runner is
  # pinned like the others (the spec said `ubuntu-latest`, which is moving to Ubuntu 26).
  server:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:17@sha256:7ad98329d513dd497293b951c195ca354274a77f12ddbbbbf85e68a811823d72
        env:
          POSTGRES_PASSWORD: ci-throwaway-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      # S4c-2 (KINIG-99): the throwaway S3-compatible store of the blob suites, SeaweedFS (`weed mini`: one container, configured by
      # environment alone, which a `services:` container can be; the choice and the facts are in ADR-0020). Pinned by digest.
      s3:
        image: chrislusf/seaweedfs:4.52@sha256:57877e32bb90073b37dc109b438ba66e84fd5ed9ced5f5c04f56444ef243ce59
        env:
          AWS_ACCESS_KEY_ID: ci-throwaway-s3-access
          AWS_SECRET_ACCESS_KEY: ci-throwaway-s3-secret-0123456789
          S3_BUCKET: kinige-test
        ports:
          - 8333:8333
    env:
      KINIGE_TEST_DATABASE_URL: postgres://postgres:ci-throwaway-password@localhost:5432/postgres
      KINIGE_TEST_S3_URL: http://localhost:8333
      KINIGE_TEST_S3_BUCKET: kinige-test
      KINIGE_TEST_S3_ACCESS_KEY: ci-throwaway-s3-access
      KINIGE_TEST_S3_SECRET_KEY: ci-throwaway-s3-secret-0123456789
      # A missing S3 store is a failure here, not a quiet skip of the S3 half of every blob suite.
      KINIGE_TEST_REQUIRE_S3: "1"
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@v7

      - name: Rust toolchain
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: |
            .
            spikes/S4a-sync
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # The store creates its bucket a moment after it listens: wait until a signed listing of the bucket is answered with 200.
      - name: Wait for the S3 store
        run: |
          for _ in $(seq 1 60); do
            code="$(curl -s -o /dev/null -w '%{http_code}' -A kinige-dev --aws-sigv4 'aws:amz:us-east-1:s3' \
              --user "${KINIGE_TEST_S3_ACCESS_KEY}:${KINIGE_TEST_S3_SECRET_KEY}" "${KINIGE_TEST_S3_URL}/${KINIGE_TEST_S3_BUCKET}?list-type=2" || true)"
            [ "$code" = "200" ] && exit 0
            sleep 2
          done
          echo "the S3 store did not come up (last answer: $code)" >&2
          docker ps -a
          exit 1

      - run: cargo clippy -p kinige-server --features pg-tests --all-targets -- -D warnings
      - run: cargo test -p kinige-server --features pg-tests

      # Property 8 and the restore mixes now run here: every restore is a real dump loaded into a clean database. The count is small and fixed.
      - name: Simulation against the real server
        working-directory: spikes/S4a-sync
        env:
          S4A_REAL_CASES: "20"
          S4A_REAL_CASES3: "5"
          S4A_SEED: "1"
        run: cargo test --features real-server --test real_server

  # Spike S4c-2 (KINIG-99): the self-hosting stack of `deploy/`, on a runner's own Docker. `deploy/smoke.sh` brings up the server, Postgres,
  # a blob volume and the proxy with TLS from the repository's Dockerfile and compose file (every image pinned by digest), registers,
  # pushes, uploads a blob and pulls through the proxy, takes a backup, checks that SIGTERM stops the server with exit code 0, restores
  # the backup into a SECOND, fresh stack and checks the old cursor (`GenerationChanged`), every envelope and the blob byte for byte.
  compose:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@v7

      - name: Rust toolchain
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Smoke test
        run: deploy/smoke.sh

  # The self-check of a branch (KINIG-111, scripts/pre-pr-check.py) against the PR's base: long files, backup files,
  # invisible characters, unaligned tables, whitespace, rustfmt. Pull requests only; a push to main has no base to diff.
  pre-pr-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Rust toolchain (for rustfmt)
        run: rustup toolchain install
      - name: Pre-PR check against the base branch
        env:
          BASE_REF: ${{ github.base_ref }}
        run: python3 -I scripts/pre-pr-check.py --base "origin/$BASE_REF"

  # Secrets in the git history. False positives go in .gitleaksignore (the fingerprint and the reason). The binary is pinned by version and sha256.
  gitleaks:
    runs-on: ubuntu-24.04
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          curl -sSfL -A kinige-dev -o "$RUNNER_TEMP/gitleaks.tgz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tgz" -C "$RUNNER_TEMP" gitleaks

      # --redact: the found value does not get into the log.
      - name: Search for secrets
        run: '"$RUNNER_TEMP/gitleaks" git . --redact --no-banner'
