# CI на каждый PR (GitHub Actions, Linux-раннер). Сборка и подпись .app — локально: scripts/build-app.sh.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Ручной запуск: коммит эталонов из visual-update.yml идёт от GITHUB_TOKEN и сам CI не запускает.
  workflow_dispatch:

# Раннер закреплён: ubuntu-latest переезжает на Ubuntu 26, а там имена пакетов WebKitGTK не проверены.
jobs:
  rust:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      # Системные библиотеки Tauri на Linux (wry/WebKitGTK).
      - name: Системные зависимости Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential curl pkg-config libssl-dev \
            libwebkit2gtk-4.1-dev libxdo-dev libayatana-appindicator3-dev librsvg2-dev

      # Версия и компоненты берутся из rust-toolchain.toml; rustup на раннере GitHub уже есть.
      - name: Rust toolchain
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: kinige-domain под wasm32
        run: cargo build -p kinige-domain --target wasm32-unknown-unknown
      # `cargo test` выше перегенерировал TS-типы (ts-rs); любое отличие от закоммиченного,
      # включая новые неотслеживаемые файлы, — падаем (`git diff` их не видит).
      - name: Сгенерированные TS-типы актуальны
        run: |
          changed="$(git status --porcelain -- web/src/api/generated)"
          if [ -n "$changed" ]; then
            echo "$changed"
            exit 1
          fi

  # Покрытие тестами → Codecov (бейджи в README, комментарий в PR). Информационно: порог не валит CI (codecov.yml).
  coverage:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Системные зависимости Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential curl pkg-config libssl-dev \
            libwebkit2gtk-4.1-dev libxdo-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Rust toolchain
        run: |
          rustup toolchain install
          rustup component add llvm-tools-preview

      - uses: Swatinem/rust-cache@v2

      - uses: taiki-e/install-action@v2.87.28
        with:
          tool: cargo-llvm-cov@0.9.1

      # Тестовые модули внутри src/ (`tests.rs`, `*_tests.rs`, `tests_*.rs`) в покрытие не входят; каталоги tests/ llvm-cov отбрасывает сам.
      - name: Покрытие Rust
        run: >-
          cargo llvm-cov --workspace --lcov --output-path lcov-rust.info
          --ignore-filename-regex '(^|/)(tests|[a-z0-9_]+_tests|tests_[a-z0-9_]+|[a-z0-9_]+_tests_[a-z0-9_]+)\.rs$'

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Покрытие web
        working-directory: web
        run: |
          npm ci
          npm run test:coverage

      - uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: lcov-rust.info
          flags: rust
          disable_search: true
          fail_ci_if_error: false

      - uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: web/coverage/lcov.info
          flags: web
          disable_search: true
          fail_ci_if_error: false

  web:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: tokens.css и themes.css актуальны
        run: |
          npm run tokens
          changed="$(git status --porcelain -- src/ui/tokens.css src/ui/themes.css)"
          if [ -n "$changed" ]; then
            echo "$changed"
            exit 1
          fi
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

  visual:
    runs-on: ubuntu-24.04
    # Тот же образ, что в visual-update.yml: эталоны снимаются в такой же среде.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - run: npm ci
      - run: npm run build-storybook
      - run: npx playwright test
