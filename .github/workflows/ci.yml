# CI на каждый PR и push в main (GitHub Actions): Linux-раннеры, а код приложения под macOS — на macos-15 (задание `macos`).
# Windows (слайс 10a) — на windows-2025 (задание `windows`).
# Сборка и подпись .app — локально: scripts/build-app.sh; снимки настоящего окна — screens.yml (macOS-раннер).
name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Коммиты бота из visual-update.yml и screens.yml идут от GITHUB_TOKEN и CI сами не запускают: эти workflow вызывают
  # `gh workflow run ci.yml` (workflow_dispatch от GITHUB_TOKEN запускается). Руками — тоже можно.
  workflow_dispatch:

# Права по умолчанию — только чтение; шире не нужно ни одному заданию.
permissions:
  contents: read

# Раннер закреплён: ubuntu-latest переезжает на Ubuntu 26, а там имена пакетов WebKitGTK не проверены.
jobs:
  rust:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      # Системные библиотеки Tauri на Linux (wry/WebKitGTK).
      - name: Системные зависимости Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential curl pkg-config libssl-dev \
            libwebkit2gtk-4.1-dev libxdo-dev libayatana-appindicator3-dev librsvg2-dev

      # Версия и компоненты берутся из rust-toolchain.toml; rustup на раннере GitHub уже есть.
      - name: Rust toolchain
        run: rustup toolchain install

      # Кэш сохраняется только на main: ветки и PR его читают (восстановление из кэша main), но не пишут,
      # иначе каждый PR занимает место в лимите 10 ГБ и вытесняет кэш main.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: kinige-domain под wasm32
        run: cargo build -p kinige-domain --target wasm32-unknown-unknown
      # `cargo test` выше перегенерировал TS-типы (ts-rs); любое отличие от закоммиченного,
      # включая новые неотслеживаемые файлы, — падаем (`git diff` их не видит).
      - name: Сгенерированные TS-типы актуальны
        run: |
          changed="$(git status --porcelain -- web/src/api/generated)"
          if [ -n "$changed" ]; then
            echo "$changed"
            exit 1
          fi

  # Код под `#[cfg(target_os = "macos")]` (панель NSPanel, трей, окно настроек) и тесты IPC src-tauri на настоящей macOS:
  # на Linux этот код не компилируется. Только крейт приложения; остальное проверяет `rust`.
  macos:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Rust toolchain
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - run: cargo clippy -p kinige --all-targets -- -D warnings
      - run: cargo test -p kinige

  # Windows (slice 10a): the app crate and the three crates it stands on. MCP is Unix-only and is compiled out there; the
  # tests that need Unix sockets, modes, symlinks or signals are gated with `#[cfg(unix)]`. The runner is pinned like the
  # others: `windows-latest` moves to a new image without notice. Everything else (fmt, wasm32, generated TS types,
  # cargo-deny) is platform independent and stays in `rust`.
  windows:
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Rust toolchain
        run: rustup toolchain install

      # The cache is saved on main only, like in the other jobs: branches and PRs restore it but do not write.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - run: cargo clippy -p kinige -p kinige-store -p kinige-domain -p kinige-mcp --all-targets -- -D warnings
      # --no-fail-fast: one run lists every failing test binary, a Windows run is too slow to find them one by one.
      - run: cargo test --no-fail-fast -p kinige -p kinige-store -p kinige-domain -p kinige-mcp

  # Покрытие Rust → Codecov (бейджи в README, комментарий в PR). Информационно: порог не валит CI (codecov.yml).
  # Отдельное задание: сборка с инструментированием (cargo llvm-cov) не делит артефакты с `rust` и идёт параллельно ему.
  # Покрытие web снимается в задании `web` тем же прогоном vitest, что и проверка.
  coverage:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Системные зависимости Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential curl pkg-config libssl-dev \
            libwebkit2gtk-4.1-dev libxdo-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Rust toolchain
        run: |
          rustup toolchain install
          rustup component add llvm-tools-preview

      # Кэш сохраняется только на main: ветки и PR его читают (восстановление из кэша main), но не пишут,
      # иначе каждый PR занимает место в лимите 10 ГБ и вытесняет кэш main.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68 # v2.88.1
        with:
          tool: cargo-llvm-cov@0.9.1

      # Тестовые модули внутри src/ (`tests.rs`, `*_tests.rs`, `tests_*.rs`) в покрытие не входят; каталоги tests/ llvm-cov отбрасывает сам.
      - name: Покрытие Rust
        run: >-
          cargo llvm-cov --workspace --lcov --output-path lcov-rust.info
          --ignore-filename-regex '(^|/)(tests|[a-z0-9_]+_tests|tests_[a-z0-9_]+|[a-z0-9_]+_tests_[a-z0-9_]+)\.rs$'

      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: lcov-rust.info
          flags: rust
          disable_search: true
          fail_ci_if_error: false

  web:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: tokens.css и themes.css актуальны
        run: |
          npm run tokens
          changed="$(git status --porcelain -- src/ui/tokens.css src/ui/themes.css)"
          if [ -n "$changed" ]; then
            echo "$changed"
            exit 1
          fi
      - name: Помощники сценариев снимков (пустой дамп окна — ошибка)
        working-directory: .
        run: bash scripts/screens/lib.test.sh
      - run: npm run typecheck
      - run: npm run lint
      # Тесты и покрытие одним прогоном vitest; отчёт уходит в Codecov (флаг web), сбой отправки CI не валит.
      - run: npm run test:coverage
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: web/coverage/lcov.info
          flags: web
          disable_search: true
          fail_ci_if_error: false

  visual:
    runs-on: ubuntu-24.04
    # Тот же образ, что в visual-update.yml: эталоны снимаются в такой же среде.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - run: npm ci
      - run: npm run build-storybook
      - run: npx playwright test
      # Расхождения снимков (ожидаемый, полученный и разница) остаются в прогоне: мигающий снимок можно разобрать по картинкам.
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: visual-test-results
          path: web/test-results
          if-no-files-found: ignore

  # Лицензии, известные уязвимости (RustSec) и источники крейтов — deny.toml.
  deny:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      # cargo-deny вызывает `cargo metadata`: версия Rust берётся из rust-toolchain.toml.
      - name: Rust toolchain
        run: rustup toolchain install

      - uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68 # v2.88.1
        with:
          tool: cargo-deny@0.20.2

      - run: cargo deny check advisories licenses sources

  # Секреты в истории git. Ложные срабатывания — в .gitleaksignore (отпечаток и причина). Бинарник закреплён версией и sha256.
  gitleaks:
    runs-on: ubuntu-24.04
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Установить gitleaks
        run: |
          curl -sSfL -A kinige-dev -o "$RUNNER_TEMP/gitleaks.tgz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tgz" -C "$RUNNER_TEMP" gitleaks

      # --redact: найденное значение в лог не попадает.
      - name: Поиск секретов
        run: '"$RUNNER_TEMP/gitleaks" git . --redact --no-banner'
