# ВРЕМЕННО (KINIG-40/38): окно захвата и главное окно на macOS-раннере, прозрачность углов и тёмные полосы прокрутки. Удаляется следующим коммитом.
name: tmp-canvas-check
on:
  push:
    branches: [fix/kinig-40-scrollbars]
permissions:
  contents: read
jobs:
  shots:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Полосы прокрутки всегда (раннер, не Mac пользователя)
        run: |
          defaults write -g AppleShowScrollBars -string Always
          defaults read -g AppleShowScrollBars
      - name: Собрать приложение
        run: scripts/build-app.sh
      - name: Снимки
        timeout-minutes: 20
        run: scripts/tmp-canvas-check.sh
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: canvas-out
          path: canvas-out
          if-no-files-found: warn
