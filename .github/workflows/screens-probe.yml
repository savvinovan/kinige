# Проба: можно ли снимать окно Kinige и вводить действия на macOS-раннере GitHub (слайс 4a, KINIG-11).
# Запуск: gh workflow run screens-probe.yml --ref <ветка>. Ничего не коммитит; PNG и диагностика — в артефакте.
name: Screens probe

on:
  workflow_dispatch:
  # Файла ещё нет в main, а `gh workflow run` его там не найдёт: проба стартует от правки самого файла в ветке.
  push:
    branches: [slice/4a-mcp]
    paths: [.github/workflows/screens-probe.yml]

permissions:
  contents: read

jobs:
  probe:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Rust toolchain
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - name: Собрать приложение
        env:
          KINIGE_IDENTIFIER: me.savvinov.kinige.accept
        run: scripts/build-app.sh

      - name: Демо-данные
        run: |
          K="$RUNNER_TEMP/kinige-screens"
          mkdir -p "$K/data" "$K/mirror" "$K/out"
          cargo run --release -q -p kinige-store --example seed_demo -- "$K/data" "$K/mirror"

      # Что раннер разрешает: сеанс, дисплей, права TCC. Только вывод, ничего не меняется.
      - name: Диагностика раннера
        continue-on-error: true
        run: |
          K="$RUNNER_TEMP/kinige-screens"
          {
            echo "== sw_vers"; sw_vers
            echo "== whoami / managername"; whoami; launchctl managername
            echo "== displays"; system_profiler SPDisplaysDataType | head -30
            echo "== TCC (system db)"
            sudo sqlite3 "/Library/Application Support/com.apple.TCC/TCC.db" "select service, client, auth_value from access" 2>&1 || true
            echo "== TCC (user db)"
            sqlite3 "$HOME/Library/Application Support/com.apple.TCC/TCC.db" "select service, client, auth_value from access" 2>&1 || true
            echo "== frontmost"; osascript -e 'tell application "System Events" to get name of first process whose frontmost is true' 2>&1 || true
          } > "$K/out/runner-diagnostics.txt" 2>&1
          cat "$K/out/runner-diagnostics.txt"

      - name: Запустить приложение на временных данных
        run: |
          K="$RUNNER_TEMP/kinige-screens"
          cp -R target/release/bundle/macos/Kinige.app "$K/Kinige.app"
          plutil -insert LSEnvironment -json \
            "{\"KINIGE_DATA_DIR\":\"$K/data\",\"KINIGE_MIRROR_DIR\":\"$K/mirror\"}" "$K/Kinige.app/Contents/Info.plist"
          codesign --force --deep -s - "$K/Kinige.app"
          open -a "$K/Kinige.app"
          for i in $(seq 1 30); do
            if scripts/screenshot-window.sh "$K/out/probe-window.png" kinige list | grep -q layer=0; then break; fi
            sleep 2
          done
          scripts/screenshot-window.sh /dev/null kinige list > "$K/out/probe-window-list.txt" || true
          scripts/screenshot-window.sh "$K/out/probe-window.png" kinige main || echo "снимок окна не удался"
          screencapture -x "$K/out/probe-fullscreen.png" || echo "снимок экрана не удался"
          lsappinfo list | grep -A6 'me.savvinov.kinige.accept' > "$K/out/lsappinfo.txt" || true
          cat "$K/out/lsappinfo.txt"

      # Один вход: действие доступности (AXPress) и одно нажатие клавиши в окно. Если права нет — будет ошибка в логе.
      - name: Проба ввода
        continue-on-error: true
        run: |
          K="$RUNNER_TEMP/kinige-screens"
          PID="$(pgrep -f "$K/Kinige.app/Contents/MacOS/kinige" | head -1)"
          echo "pid=$PID" | tee "$K/out/input-probe.txt"
          osascript -l JavaScript -e '
            function run(argv) {
              const se = Application("System Events");
              const proc = se.processes.whose({ unixId: Number(argv[0]) })[0];
              const out = [];
              function walk(el, depth) {
                if (depth > 6) return;
                let kids = [];
                try { kids = el.uiElements(); } catch (e) { return; }
                for (const k of kids) {
                  let role = "", title = "", desc = "";
                  try { role = k.role(); } catch (e) {}
                  try { title = k.title() || ""; } catch (e) {}
                  try { desc = k.description() || ""; } catch (e) {}
                  out.push(" ".repeat(depth) + role + " " + title + " " + desc);
                  walk(k, depth + 1);
                }
              }
              walk(proc.windows[0], 0);
              return out.join("\n");
            }' "$PID" 2>&1 | head -60 | tee -a "$K/out/input-probe.txt"
          echo "== AXPress на «Settings»-пути: нажать кнопку профиля" | tee -a "$K/out/input-probe.txt"
          osascript -l JavaScript -e '
            function run(argv) {
              const se = Application("System Events");
              const proc = se.processes.whose({ unixId: Number(argv[0]) })[0];
              function walk(el, depth) {
                if (depth > 18) return null;
                let kids = [];
                try { kids = el.uiElements(); } catch (e) { return null; }
                for (const k of kids) {
                  let t = "";
                  try { t = (k.title() || "") + " " + (k.description() || ""); } catch (e) {}
                  if (t.includes("Me") && k.role() === "AXButton") { k.actions.byName("AXPress").perform(); return "pressed " + t; }
                  const r = walk(k, depth + 1);
                  if (r) return r;
                }
                return null;
              }
              return walk(proc.windows[0], 0) || "кнопка не найдена";
            }' "$PID" 2>&1 | tee -a "$K/out/input-probe.txt"
          sleep 2
          scripts/screenshot-window.sh "$K/out/probe-after-axpress.png" kinige main || true
          echo "== keystroke" | tee -a "$K/out/input-probe.txt"
          osascript -e 'tell application "System Events" to keystroke "a"' 2>&1 | tee -a "$K/out/input-probe.txt"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: screens-probe
          path: ${{ runner.temp }}/kinige-screens/out
          if-no-files-found: warn
