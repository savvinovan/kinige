# Shots of the real Kinige window on the GitHub macOS runner for the acceptance of a slice. Two jobs:
#   shots  - builds the .app and runs scripts/screens/<slice>.sh on synthetic data (temporary KINIGE_DATA_DIR and
#            KINIGE_MIRROR_DIR); read-only permissions, the token is not kept after checkout; the result is an artifact;
#   commit - short: downloads the artifact and commits docs/screens/<slice>/ to the branch (the only place with write permission,
#            no npm, no cargo and no third-party caches).
# Run: gh workflow run screens.yml --ref <branch> -f slice=4a   (does not work in main and on tags).
# Windows (slice 10a): -f os=windows -f slice=10a runs the job shots-windows on windows-2025: it builds the NSIS installer,
# installs it silently and runs scripts/screens/<slice>.ps1 (input is keys sent with SendKeys on the disposable runner VM);
# the commit job is the same.
# A commit by GITHUB_TOKEN does not start CI by itself (a push event), but starting through workflow_dispatch by GITHUB_TOKEN is allowed:
# the last step of the commit job starts ci.yml on the branch (the actions: write permission is needed, only this job has it).
# Input is accessibility actions only (scripts/screens/ax.js): the runner gives osascript the Accessibility permission (checked by a probe).
name: Screens

on:
  workflow_dispatch:
    inputs:
      slice:
        description: The scenario scripts/screens/<slice>.sh and the directory docs/screens/<slice> (only 0-9, a-z and a hyphen)
        default: 4a
        required: true
      os:
        description: Screenshot runner - macos (scripts/screens/<slice>.sh) or windows (scripts/screens/<slice>.ps1)
        type: choice
        options: [macos, windows]
        default: macos

# Default permissions are read-only; write only for the commit job.
permissions:
  contents: read

concurrency:
  group: screens-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shots:
    # Shots change a branch and a PR: branches only, not main.
    if: startsWith(github.ref, 'refs/heads/') && github.ref != 'refs/heads/main' && inputs.os != 'windows'
    runs-on: macos-15
    timeout-minutes: 110
    permissions:
      contents: read
    env:
      SLICE: ${{ inputs.slice || '4a' }}
    steps:
      - name: Check the slice name
        run: |
          if ! [[ "$SLICE" =~ ^[0-9a-z-]+$ ]]; then
            echo "slice must match ^[0-9a-z-]+$"
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Rust toolchain
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      # The system dark theme, as on the user's Mac: the window title in the shot is dark. `defaults write` without restarting the session
      # did not take effect (checked by a run), so we switch through System Events.
      - name: Dark theme
        run: |
          osascript -e 'tell application "System Events" to tell appearance preferences to set dark mode to true'
          sleep 3
          defaults read -g AppleInterfaceStyle || true

      - name: Build the app
        env:
          KINIGE_IDENTIFIER: me.savvinov.kinige.accept
        run: scripts/build-app.sh

      - name: Shots scenario
        timeout-minutes: 90
        run: |
          mkdir -p "$RUNNER_TEMP/kinige-screens"
          K="$RUNNER_TEMP/kinige-screens" scripts/screens/${SLICE}.sh "$PWD/target/release/bundle/macos/Kinige.app"

      # The shots and the check texts are what goes into the branch; the debug window tree dumps are separate and do not go into the repository.
      - uses: actions/upload-artifact@v7
        if: success()
        with:
          name: screens-${{ env.SLICE }}
          path: docs/screens/${{ env.SLICE }}
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: screens-${{ env.SLICE }}-debug
          path: ${{ runner.temp }}/kinige-screens/debug
          if-no-files-found: warn

  # Windows (slice 10a): the same contract as `shots`: read-only token, the result is an artifact, nothing is committed here.
  shots-windows:
    if: startsWith(github.ref, 'refs/heads/') && github.ref != 'refs/heads/main' && inputs.os == 'windows'
    runs-on: windows-2025
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      SLICE: ${{ inputs.slice || '4a' }}
    steps:
      - name: Check the slice name
        shell: bash
        run: |
          if ! [[ "$SLICE" =~ ^[0-9a-z-]+$ ]]; then
            echo "slice must match ^[0-9a-z-]+$"
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Rust toolchain
        shell: bash
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Build the installer
        shell: bash
        run: scripts/build-windows.sh

      # Windows PowerShell 5.1 (`shell: powershell`); keys are injected with SendKeys, the data checks read the database and the disk.
      - name: Screens scenario
        shell: powershell
        timeout-minutes: 25
        run: |
          $installer = (Get-ChildItem "target\release\bundle\nsis\*-setup.exe" | Select-Object -First 1).FullName
          & "scripts\screens\$env:SLICE.ps1" -Installer $installer
          exit $LASTEXITCODE

      # The screenshots and the check texts are what reaches the branch; the UI tree dumps are separate and never committed.
      - uses: actions/upload-artifact@v7
        if: success()
        with:
          name: screens-${{ env.SLICE }}
          path: docs/screens/${{ env.SLICE }}
          if-no-files-found: error

      # A failed scenario keeps its pictures for diagnosis; they are never committed (the commit job needs the artifact above).
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: screens-${{ env.SLICE }}-partial
          path: docs/screens/${{ env.SLICE }}
          if-no-files-found: warn

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: screens-${{ env.SLICE }}-debug
          path: ${{ runner.temp }}/kinige-screens/debug
          if-no-files-found: warn

  commit:
    needs: [shots, shots-windows]
    if: always() && (needs.shots.result == 'success' || needs.shots-windows.result == 'success')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: write
    env:
      SLICE: ${{ inputs.slice || '4a' }}
      RUNNER_OS_NAME: ${{ inputs.os == 'windows' && 'Windows' || 'macOS' }}
    steps:
      - name: Check the slice name
        run: |
          if ! [[ "$SLICE" =~ ^[0-9a-z-]+$ ]]; then
            echo "slice must match ^[0-9a-z-]+$"
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}

      - uses: actions/download-artifact@v8
        with:
          name: screens-${{ env.SLICE }}
          path: ${{ runner.temp }}/screens

      # The shots directory is replaced entirely (shots with old names go too); only docs/screens/<slice>/ is touched.
      - name: Commit the shots to the branch
        id: commit
        run: |
          rm -rf "docs/screens/${SLICE}"
          mkdir -p "docs/screens/${SLICE}"
          cp -R "$RUNNER_TEMP/screens/." "docs/screens/${SLICE}/"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- "docs/screens/${SLICE}"
          if git diff --cached --quiet; then
            echo "the shots did not change"
            exit 0
          fi
          git diff --cached --stat | tail -1
          git commit -m "Screens ${SLICE} from CI (${RUNNER_OS_NAME} runner)"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      # A bot commit does not start CI; workflow_dispatch by GITHUB_TOKEN does (GitHub documentation, "Triggering a workflow").
      - name: Start CI on the branch
        if: steps.commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run ci.yml --ref "$GITHUB_REF_NAME"
