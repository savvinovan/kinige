# Интеграция Huly (self-hosted huly.savvinov.me) к каждому новому PR и issue пишет комментарий «Connected to Huly®: KINIG-N»
# с публичной гостевой ссылкой на карточку. В v0.7.426 это не отключается (github-service: addHulyLink), а репозиторий
# публичный — ссылку на рабочее пространство не публикуем: комментарий бота сразу удаляется. Связь PR с задачей
# видна в самом Huly. Подробности: homelab-k3s-2/k8s/huly/README.md.
name: Remove Huly link comments

on:
  issue_comment:
    types: [created]

permissions:
  issues: write
  pull-requests: write

jobs:
  remove:
    if: github.event.comment.user.login == 'huly-savvinov[bot]' && contains(github.event.comment.body, 'Connected to')
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Удалить комментарий
        env:
          GH_TOKEN: ${{ github.token }}
          COMMENT_ID: ${{ github.event.comment.id }}
        run: gh api -X DELETE "repos/${{ github.repository }}/issues/comments/$COMMENT_ID"
