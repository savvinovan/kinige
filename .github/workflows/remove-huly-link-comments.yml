# The Huly integration (self-hosted huly.savvinov.me) writes a "Connected to Huly®: KINIG-N" comment on every new PR and issue
# with a public guest link to the card. In v0.7.426 this cannot be turned off (github-service: addHulyLink), and the repository is
# public, so we do not publish the workspace link: the bot's comment is deleted at once. The link between the PR and the task
# is visible in Huly itself. Details: homelab-k3s-2/k8s/huly/README.md.
name: Remove Huly link comments

on:
  issue_comment:
    types: [created]

permissions:
  issues: write
  pull-requests: write

jobs:
  remove:
    if: github.event.comment.user.login == 'huly-savvinov[bot]' && contains(github.event.comment.body, 'Connected to')
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Delete the comment
        env:
          GH_TOKEN: ${{ github.token }}
          COMMENT_ID: ${{ github.event.comment.id }}
        run: gh api -X DELETE "repos/${{ github.repository }}/issues/comments/$COMMENT_ID"
