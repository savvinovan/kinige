# TEMPORARY (KINIG-61): probe of the DevTools channel on a Windows runner; removed before the PR is ready.
name: Win probe
on:
  push:
    branches: ["slice/10a-windows-build"]
    paths: [".github/workflows/win-probe.yml"]
permissions:
  contents: read
  actions: read
jobs:
  probe:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - run: npm --prefix web ci
        shell: bash
      - uses: actions/download-artifact@v8
        with:
          name: dist-windows
          run-id: 41321639073
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/inst
      - name: Probe
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          function L($t) { Write-Host ((Get-Date).ToString('HH:mm:ss.fff') + ' ' + $t) }
          $app = Join-Path $env:RUNNER_TEMP 'app'
          $installer = (Get-ChildItem "$env:RUNNER_TEMP\inst\*.exe" | Select-Object -First 1).FullName
          $p = Start-Process -FilePath $installer -ArgumentList '/S', "/D=$app" -PassThru; $p.WaitForExit(600000) | Out-Null
          $exe = Get-ChildItem $app -Filter kinige.exe
          $key = 'HKLM:\SOFTWARE\Policies\Microsoft\Edge\WebView2\AdditionalBrowserArguments'
          New-Item -Path $key -Force | Out-Null
          Set-ItemProperty -Path $key -Name $exe.Name -Value '--remote-debugging-port=9222' -Type String
          $env:KINIGE_DATA_DIR = Join-Path $env:RUNNER_TEMP 'pd'
          $env:KINIGE_MIRROR_DIR = Join-Path $env:RUNNER_TEMP 'pm'
          New-Item -ItemType Directory -Force -Path $env:KINIGE_DATA_DIR, $env:KINIGE_MIRROR_DIR | Out-Null
          $proc = Start-Process -FilePath $exe.FullName -PassThru
          L "started pid $($proc.Id); cores: $env:NUMBER_OF_PROCESSORS"
          for ($i = 0; $i -lt 45; $i++) {
            Start-Sleep -Seconds 2
            $sw = [Diagnostics.Stopwatch]::StartNew()
            $r = & curl.exe -s -m 8 -o NUL -w '%{http_code}' http://127.0.0.1:9222/json/version 2>&1
            L "t=$($i*2)s curl /json/version: $r in $($sw.ElapsedMilliseconds) ms"
            if ($i % 5 -eq 0) {
              $top = Get-Process | Sort-Object CPU -Descending | Select-Object -First 4 | ForEach-Object { "$($_.ProcessName)=$([math]::Round($_.CPU,1))" }
              L ("top cpu: " + ($top -join ', '))
              $app = Get-Process -Id $proc.Id -ErrorAction SilentlyContinue
              L ("app responding: " + $app.Responding)
            }
          }
          L 'playwright:'
          $sw = [Diagnostics.Stopwatch]::StartNew()
          & node scripts\screens\cdp.mjs 9222 main text 2>&1 | ForEach-Object { L ("  " + ([string]$_).Substring(0, [math]::Min(160, ([string]$_).Length))) }
          L "playwright took $($sw.ElapsedMilliseconds) ms"
          Stop-Process -Id $proc.Id -Force
          Remove-Item -Path $key -Recurse -Force
          exit 0
