# TEMPORARY (KINIG-61): probe of UI Automation against the Windows build; removed before the PR is ready.
name: Win UI probe
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  probe:
    if: startsWith(github.ref, 'refs/heads/') && github.ref != 'refs/heads/main'
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: dist-windows
          run-id: 41321639073
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/inst
      - name: Probe
        shell: powershell
        run: |
          $installer = (Get-ChildItem "$env:RUNNER_TEMP\inst\*.exe" | Select-Object -First 1).FullName
          & "scripts\screens\probe.ps1" -Installer $installer
          exit 0
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: probe
          path: ${{ runner.temp }}/probe
          if-no-files-found: warn
