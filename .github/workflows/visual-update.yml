# Новые эталоны визуальных тестов Storybook. Снимаются в том же контейнере Playwright, что и проверка в ci.yml,
# и коммитятся в ветку, с которой запущен workflow:
#   gh workflow run visual-update.yml --ref <ветка>
# Коммит от GITHUB_TOKEN CI сам не запускает (push-событие), но запуск через workflow_dispatch от GITHUB_TOKEN разрешён:
# после коммита задача ci запускает ci.yml на ветке (право actions: write только у неё).
# Коммитятся только изменившиеся и новые эталоны (--update-snapshots=changed); эталоны удалённых историй убирает
# scripts/prune-visual-baselines.mjs. Эталоны, которые прошли сравнение, не перезаписываются: репозиторий не раздувается.
name: Visual baselines

on:
  workflow_dispatch:

# Права по умолчанию — только чтение; запись только у задачи update, запуск CI — только у задачи ci.
permissions:
  contents: read

jobs:
  update:
    # Эталоны меняются только через ветку и PR.
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      pushed: ${{ steps.commit.outputs.pushed }}
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
    steps:
      # Без git в контейнере checkout скачивает архив без .git, и закоммитить было бы нечего.
      - name: git
        run: apt-get update && apt-get install -y --no-install-recommends git

      - uses: actions/checkout@v7

      - name: Снять эталоны
        working-directory: web
        run: |
          npm ci
          npm run build-storybook
          # Перезаписываются только эталоны, не прошедшие сравнение (порог тот же, что в проверке), и создаются недостающие.
          npx playwright test --update-snapshots=changed
          node ../scripts/prune-visual-baselines.mjs

      - name: Закоммитить
        id: commit
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A web/tests/visual/stories.spec.ts-snapshots
          if git diff --cached --quiet; then
            echo "эталоны не изменились"
            exit 0
          fi
          git diff --cached --stat | tail -1
          git commit -m "Visual baselines from CI"
          git push
          echo "pushed=true" >> "$GITHUB_OUTPUT"

  # Отдельная задача: в контейнере Playwright нет gh, а право actions: write не нужно задаче с записью в репозиторий.
  ci:
    needs: update
    if: needs.update.outputs.pushed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      # workflow_dispatch от GITHUB_TOKEN запускает workflow (в отличие от push; документация GitHub, «Triggering a workflow»).
      - name: Запустить CI на ветке
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run ci.yml --ref "$GITHUB_REF_NAME"
