# New baselines of the Storybook visual tests. They are captured in the same Playwright container as the check in ci.yml,
# and committed to the branch the workflow is started from:
#   gh workflow run visual-update.yml --ref <branch>
# Three jobs, as in screens.yml:
#   shots  - npm ci, the Storybook build and the shots; read-only permissions, the token is not kept after checkout
#            (package install scripts do not see it); the result is an artifact;
#   commit - short: commits the changed baselines to the branch (the only place with write permission, no npm and no build);
#   ci     - starts ci.yml on the branch (the actions: write permission is only theirs).
# Only changed and new baselines are committed (--update-snapshots=changed); baselines of removed stories are removed by
# scripts/prune-visual-baselines.mjs. Baselines that passed the comparison are not overwritten: the repository does not bloat.
# A commit by GITHUB_TOKEN does not start CI by itself (a push event), but starting through workflow_dispatch by GITHUB_TOKEN is allowed.
# The Playwright image version here and in ci.yml must match @playwright/test in web/package.json (changed by hand).
name: Visual baselines

on:
  workflow_dispatch:

# Default permissions are read-only; write only for the commit job, starting CI only for the ci job.
permissions:
  contents: read

jobs:
  shots:
    # Baselines change only through a branch and a PR.
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Capture the baselines
        working-directory: web
        run: |
          npm ci
          npm run build-storybook
          # Only baselines that failed the comparison are overwritten (the same threshold as in the check), and missing ones are created.
          npx playwright test --update-snapshots=changed
          node ../scripts/prune-visual-baselines.mjs

      # The baseline directory as one archive (the file names are Cyrillic, an archive is safer for an artifact).
      - name: Pack the baselines
        run: tar -czf "$RUNNER_TEMP/baselines.tgz" -C web/tests/visual stories.spec.ts-snapshots

      - uses: actions/upload-artifact@v7
        with:
          name: visual-baselines
          path: ${{ runner.temp }}/baselines.tgz
          if-no-files-found: error

  commit:
    needs: shots
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      pushed: ${{ steps.commit.outputs.pushed }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}

      - uses: actions/download-artifact@v8
        with:
          name: visual-baselines
          path: ${{ runner.temp }}/baselines

      # The archive holds the whole directory (already without the baselines of removed stories); only the differences from the branch get into the commit.
      - name: Commit
        id: commit
        run: |
          rm -rf web/tests/visual/stories.spec.ts-snapshots
          tar -xzf "$RUNNER_TEMP/baselines/baselines.tgz" -C web/tests/visual
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A web/tests/visual/stories.spec.ts-snapshots
          if git diff --cached --quiet; then
            echo "the baselines did not change"
            exit 0
          fi
          git diff --cached --stat | tail -1
          git commit -m "Visual baselines from CI"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
          echo "pushed=true" >> "$GITHUB_OUTPUT"

  # A separate job: the job that writes to the repository does not need the actions: write permission.
  ci:
    needs: commit
    if: needs.commit.outputs.pushed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      # workflow_dispatch by GITHUB_TOKEN starts a workflow (unlike push; GitHub documentation, "Triggering a workflow").
      - name: Start CI on the branch
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run ci.yml --ref "$GITHUB_REF_NAME"
