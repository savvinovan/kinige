# Kinige release (ADR-0012): tag vX.Y.Z -> builds on a macOS and a Windows runner -> GitHub Release with the .dmg, .zip, the
# Windows installer .exe and one SHA256SUMS. Three jobs:
#   build-macos   - read-only permissions, the token is not kept after checkout; checks the tag, builds the .app and .dmg
#                   (scripts/build-app.sh, ad-hoc signature, ADR-0003), checks the signature and the version, computes the
#                   sums; the result is an artifact. No caches: the release is built from scratch so that nothing from a
#                   branch cache gets into it;
#   build-windows - the same on windows-2025 (slice 10a): an unsigned per-user NSIS installer (scripts/build-windows.sh); the
#                   version in the exe and in the installer name is checked against the tag; the result is its own artifact
#                   and its own part of the sums;
#   publish       - short: downloads both artifacts, merges the parts into one SHA256SUMS, checks it and creates the Release
#                   (the only place with write permission, no npm and no cargo).
# `scripts/release.sh --tag X.Y.Z` sets the tag after the "Release vX.Y.Z" PR is merged. Re-run for an existing tag (the build failed):
#   gh workflow run release.yml -f tag=vX.Y.Z            (publish=false: build and upload the artifacts, do not create a Release)
name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Готовый тег vX.Y.Z (собирается он, а не ветка, с которой запущен workflow)
        required: true
      publish:
        description: Создать GitHub Release (выключить — только собрать и положить артефакт)
        type: boolean
        default: true

# Права по умолчанию — только чтение; запись только у задачи publish.
permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build-macos:
    runs-on: macos-15
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Проверить имя тега
        run: |
          if ! [[ "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "тег должен быть vX.Y.Z (семвер без приставок), а не $TAG"
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          # Повтор по тегу собирает сам тег, а не ветку, с которой запущен workflow.
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - name: Rust toolchain
        run: rustup toolchain install

      # Тег = «v» + версия из Cargo.toml (единственный источник, ADR-0012).
      - name: Проверить тег и версию
        run: |
          PKGID="$(cargo pkgid -p kinige --offline)"
          VERSION="${PKGID##*[#@]}"
          if [ "$TAG" != "v$VERSION" ]; then
            echo "тег $TAG не совпадает с версией $VERSION в Cargo.toml"
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      # Релиз собирается только из main: тег на коммите чужой ветки не соберётся.
      - name: Проверить, что коммит тега в main
        if: github.ref_type == 'tag' || inputs.tag
        run: |
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "коммит тега $TAG не входит в main"
            exit 1
          fi

      - run: npm --prefix web ci

      # `CI=true` на раннере заставляет bundle_dmg пропустить оформление окна образа через Finder (AppleScript).
      - name: Собрать .app и .dmg
        env:
          KINIGE_BUNDLES: app,dmg
        run: scripts/build-app.sh

      - name: Файлы релиза и проверка подписи
        run: |
          BUNDLE=target/release/bundle
          DIST="$RUNNER_TEMP/dist"
          NAME="Kinige-$VERSION-macos-arm64"
          mkdir -p "$DIST"

          DMGS=("$BUNDLE"/dmg/*.dmg)
          [ "${#DMGS[@]}" -eq 1 ] || { echo "ожидался один .dmg, найдено ${#DMGS[@]}"; exit 1; }
          cp "${DMGS[0]}" "$DIST/$NAME.dmg"
          ditto -c -k --keepParent "$BUNDLE/macos/Kinige.app" "$DIST/$NAME.zip"

          # Подпись проверяется у того, что получит пользователь: приложение внутри образа и распакованный архив.
          MNT="$(mktemp -d)"
          hdiutil attach -nobrowse -readonly -mountpoint "$MNT" "$DIST/$NAME.dmg"
          codesign --verify --deep --strict --verbose=2 "$MNT/Kinige.app"
          MAIN="$(plutil -extract CFBundleExecutable raw "$MNT/Kinige.app/Contents/Info.plist")"
          for BIN in "$MAIN" kinige-mcp; do
            ARCHS="$(lipo -archs "$MNT/Kinige.app/Contents/MacOS/$BIN")"
            if [ "$ARCHS" != "arm64" ]; then
              echo "$BIN: архитектуры «$ARCHS», ожидалась arm64"
              exit 1
            fi
          done
          hdiutil detach "$MNT"
          UNZ="$(mktemp -d)"
          ditto -x -k "$DIST/$NAME.zip" "$UNZ"
          codesign --verify --deep --strict --verbose=2 "$UNZ/Kinige.app"

          # The sums of this platform; `publish` merges them into one SHA256SUMS.
          (cd "$DIST" && shasum -a 256 "$NAME.dmg" "$NAME.zip" > SHA256SUMS.macos && cat SHA256SUMS.macos && ls -l)

      - uses: actions/upload-artifact@v7
        with:
          name: dist-macos
          path: ${{ runner.temp }}/dist
          if-no-files-found: error

  # Windows (slice 10a): unsigned NSIS installer, per-user, no administrator rights. The MCP bridge is not part of it.
  build-windows:
    runs-on: windows-2025
    timeout-minutes: 60
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Check the tag name
        run: |
          if ! [[ "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "the tag must be vX.Y.Z (semver without suffixes), not $TAG"
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - name: Rust toolchain
        run: rustup toolchain install

      # Tag = "v" + the version in Cargo.toml (the only source, ADR-0012).
      - name: Check the tag and the version
        run: |
          PKGID="$(cargo pkgid -p kinige --offline)"
          VERSION="${PKGID##*[#@]}"
          if [ "$TAG" != "v$VERSION" ]; then
            echo "the tag $TAG does not match the version $VERSION in Cargo.toml"
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Check that the tag commit is in main
        if: github.ref_type == 'tag' || inputs.tag
        run: |
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "the commit of $TAG is not in main"
            exit 1
          fi

      - run: npm --prefix web ci

      # Builds the installer and checks that the version in kinige.exe and in the installer name equals Cargo.toml.
      - name: Build the installer
        run: scripts/build-windows.sh

      - name: Release files
        run: |
          DIST="$RUNNER_TEMP/dist"
          NAME="Kinige-$VERSION-windows-x64-setup.exe"
          mkdir -p "$DIST"
          # scripts/build-windows.sh already gave the installer this name.
          cp "target/release/bundle/nsis/$NAME" "$DIST/$NAME"
          (cd "$DIST" && sha256sum "$NAME" > SHA256SUMS.windows && cat SHA256SUMS.windows && ls -l)

      - uses: actions/upload-artifact@v7
        with:
          name: dist-windows
          path: ${{ runner.temp }}/dist
          if-no-files-found: error

  publish:
    needs: [build-macos, build-windows]
    if: github.ref_type == 'tag' || (github.event_name == 'workflow_dispatch' && inputs.publish)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      # Нужен только .github/release-notes.md из коммита тега; токен после checkout не сохраняется.
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.sha }}
          persist-credentials: false

      # Both artifacts into one directory: the file names are distinct, the per-platform sums are merged below.
      - uses: actions/download-artifact@v8
        with:
          pattern: dist-*
          merge-multiple: true
          path: ${{ runner.temp }}/dist

      - name: Создать Release
        run: |
          cd "$RUNNER_TEMP/dist"
          # One SHA256SUMS for every file of the release; checked before anything is published.
          cat SHA256SUMS.macos SHA256SUMS.windows > SHA256SUMS
          rm SHA256SUMS.macos SHA256SUMS.windows
          cat SHA256SUMS
          sha256sum -c SHA256SUMS
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG уже существует: удалите его вручную, если сборку нужно заменить"
            exit 1
          fi
          # Шаблон (установка с ad-hoc подписью, где лежат данные) идёт перед сгенерированным списком изменений.
          gh release create "$TAG" --verify-tag --title "Kinige ${TAG#v}" \
            --notes-file "$GITHUB_WORKSPACE/.github/release-notes.md" --generate-notes \
            ./*.dmg ./*.zip ./*.exe ./SHA256SUMS
