[package]
name = "kinige"
description = "Kinige — личный журнал в формате чата с собой"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[lib]
name = "kinige_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
kinige-domain = { path = "../crates/kinige-domain" }
kinige-store = { path = "../crates/kinige-store" }
# tray-icon: the menu bar icon (Tauri core); image-png: the tray icon from a PNG embedded in the binary; macos-private-api: needed
# by tauri-nspanel (the capture window is a non-activating NSPanel, ADR-0006) and enabled by the `macOSPrivateApi` flag in tauri.conf.json.
tauri = { version = "2.12", features = ["tray-icon", "image-png", "macos-private-api"] }
# Global shortcuts (capture and clipboard) -- from Rust only; the windows have no JS permissions.
tauri-plugin-global-shortcut = "2.4"
# A second launch shows the existing main window (PRD §5.1).
tauri-plugin-single-instance = "2.5"
# Text from the clipboard -- from Rust only (the clipboard hotkey).
arboard = { version = "3.7", default-features = false }
# Opening links in the system browser and the system folder picker dialog -- from Rust only (the window has no JS permissions, §12.3).
tauri-plugin-opener = "2.7"
tauri-plugin-dialog = "2.8"
# Preferred system languages: Rust chooses the interface language, not navigator.language (ADR-0005).
sys-locale = "0.3"
# The tray menu strings are read from the interface translation files.
serde_json = "1"
# The app log file (rotation, the OS log directory) and stderr in dev. The windows have no JS permissions: the plugin's `log` command is not granted.
tauri-plugin-log = "2.10.1"
log = "0.4.34"
# The same `Url` as in tauri (the navigation predicate); `form_urlencoded` decodes the name hint of a paste.
url = "2"
# The one-time token of a file drop (slice 7); the crate is already in the tree.
uuid = { version = "1.28", features = ["v4"] }
# The MCP server inside the app (ADR-0009): the official Rust SDK. Version 3.5.1: the latest release 3.8.0 is less than two weeks old.
# Only the `server` feature (no macros, no HTTP): the tools are described by hand, there are no network transports (§12.3).
rmcp = { version = "=3.6.0", default-features = false, features = ["server"] }
# The Unix socket and timers of the MCP server (tokio is already in the tree through tauri).
tokio = { version = "1", features = ["net", "io-util", "time", "sync", "macros", "rt"] }

[dev-dependencies]
tauri = { version = "2.12", features = ["test"] }
tempfile = "3"
# A small PNG drawn in the attachment tests (the store already uses this crate).
image = { version = "0.25", default-features = false, features = ["png"] }
# Only for the "database is newer than the app" test: raise `user_version` of the database file.
rusqlite = { version = "0.40", features = ["bundled"] }

[target.'cfg(target_os = "macos")'.dependencies]
# The capture window as an NSPanel without activating the app: a regular window does not reliably get input while another app is active.
tauri-nspanel = "2.1.1"
