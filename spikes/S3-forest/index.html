<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Kinige spike S3: forest</title>
  </head>
  <body>
    <div id="app">
      <header id="bar">
        <div class="group" role="group" aria-label="Grid">
          <button type="button" data-grid="A" aria-pressed="true">A 12 × 31</button>
          <button type="button" data-grid="B" aria-pressed="false">B 7 × 53</button>
        </div>
        <div class="group" role="group" aria-label="First weekday (grid B)">
          <button type="button" data-first="mon" aria-pressed="true">Mon</button>
          <button type="button" data-first="sun" aria-pressed="false">Sun</button>
        </div>
        <button type="button" id="fit">Whole year</button>
        <button type="button" id="grow">Add a note today</button>
        <span id="info" aria-hidden="true"></span>
      </header>
      <main id="stage">
        <canvas id="forest" tabindex="0" role="application" aria-label="Forest of the year. Arrow keys move between days."></canvas>
        <div id="card" role="tooltip" hidden></div>
      </main>
      <div id="live" class="sr" aria-live="polite"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
