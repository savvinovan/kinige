[package]
name = "kinige-domain"
description = "Правила предметной области Kinige: без IO, компилируется в WASM"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
# raw_value: группы записи хранятся и переотправляются дословно (ADR-0001 §3.3).
serde_json = { version = "1", features = ["raw_value"] }
ts-rs = "12"
url = "2"
# Snowball для русского и английского (ADR-0008); MIT/BSD-3-Clause, собирается под wasm32.
rust-stemmers = "1.2"
