[package]
name = "kinige-domain"
description = "Kinige domain rules: no IO, compiles to WASM"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
serde ={ version = "1", features = ["derive"] }
# raw_value: entry groups are stored and re-sent verbatim (ADR-0001 §3.3).
serde_json = { version = "1", features = ["raw_value"] }
ts-rs = "12"
url = "2"
# Snowball for Russian and English (ADR-0008); MIT/BSD-3-Clause, builds for wasm32.
rust-stemmers = "1.2"
# Whole years between days (slice 5): `NaiveDate::years_since`; without `clock`, so it builds for wasm32.
chrono = { version = "0.4", default-features = false, features = ["std"] }
