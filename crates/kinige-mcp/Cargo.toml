[package]
name = "kinige-mcp"
description = "MCP bridge: client stdio <-> Kinige Unix socket (ADR-0009). std only, does not open the database"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

# The bridge executable is built as `kinige-mcp-bridge` and lands in the bundle as `Contents/MacOS/kinige-mcp`
# (`bundle.externalBin` copies `binaries/kinige-mcp-<triple>` into the build directory under the name `kinige-mcp`): with the same
# name tauri-build would overwrite the cargo artifact.
[[bin]]
name = "kinige-mcp-bridge"
path = "src/main.rs"

# Deliberately no dependencies: the bridge is started by an MCP client, so it must not pull in Tauri, SQLite or domain code.
[dependencies]

# For tests only (temporary directories); does not get into the binary.
[dev-dependencies]
tempfile = "3"
