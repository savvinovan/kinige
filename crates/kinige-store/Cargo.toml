[package]
name = "kinige-store"
description = "Хранилище Kinige: SQLite, миграции, один писатель, Markdown-копия"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
kinige-domain = { path = "../kinige-domain" }
# Только фасад: приёмник логов выбирает приложение (src-tauri). В записях лога никогда нет текстов пользователя.
log = "0.4.34"
# backup: копия файла базы через backup API SQLite (`rusqlite::backup`), а не `fs::copy` (при WAL файл без `-wal` не согласован).
rusqlite = { version = "0.40", features = ["bundled", "backup"] }
serde_json = "1"
uuid = { version = "1.28", features = ["v4"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
chrono-tz = "0.10"
iana-time-zone = "0.1"
# Файл настроек (ADR-0010): хэш записанных байтов; права, владелец и O_NOFOLLOW. Оба крейта уже стоят в Cargo.lock.
sha2 = "0.10"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
