[package]
name = "kinige-store"
description = "Kinige storage: SQLite, migrations, a single writer, Markdown copy"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# The hooks of the integration tests (injected panics and faults, probes of the internals; `src/test_hooks.rs` and the items
# marked `#[doc(hidden)]`). Off by default and never on in a release graph: only the dev-dependency on this crate below turns it on,
# and `scripts/check-release-features.sh` (CI) proves that no build for people enables it (KINIG-103).
test-hooks = []

[dependencies]
kinige-domain = { path = "../kinige-domain" }
# Facade only: the app (src-tauri) chooses the log sink. Log records never contain the user's texts.
log = "0.4.34"
# backup: a copy of the database file through the SQLite backup API (`rusqlite::backup`), not `fs::copy` (with WAL a file without `-wal` is inconsistent).
rusqlite = { version = "0.41", features = ["bundled", "backup"] }
serde_json = "1"
# v7: `remote_blob_id` of an attachment (ADR-0001 §7, appendix §C.6).
uuid = { version = "1.28", features = ["v4", "v7"] }
# Attachments (slice 7, ADR-0014): image headers, orientation and thumbnails. Only the four formats we show; HEIC, AVIF, TIFF, BMP
# and SVG stay files. `image` is already in the tree through tauri (PNG only).
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp"] }
# `blob_key` of an attachment: 32 bytes from the OS CSPRNG (what `crypto_secretstream_*_keygen` does). The 0.4 line is the one `uuid` uses.
getrandom = "0.4"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
chrono-tz = "0.10"
iana-time-zone = "0.1"
# Settings file (ADR-0010): a hash of the written bytes; permissions, owner and O_NOFOLLOW. Both crates are already in Cargo.lock.
sha2 = "0.11"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
# This crate on itself: its tests (unit and `tests/`) get the hooks, a build for people does not (resolver 2+ takes the features of
# dev-dependencies only for the test targets).
kinige-store = { path = ".", features = ["test-hooks"] }
