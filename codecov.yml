# Codecov (https://app.codecov.io/gh/savvinovan/kinige): the reports come from .github/workflows/ci.yml: Rust from the `coverage` job, web from the `web` job.
# Informational for now: the statuses do not block PRs, there are no thresholds - first we see where we are.
coverage:
  status:
    project:
      default:
        informational: true
    patch:
      default:
        informational: true

flags:
  rust:
    paths:
      - crates/
      - src-tauri/
    carryforward: true
  web:
    paths:
      - web/src/
    carryforward: true

comment:
  layout: "condensed_header, diff, flags, condensed_files"
  require_changes: false
