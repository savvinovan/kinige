# Printing and "panicking" calls are allowed only in tests (unit tests in `src/` and `tests/` roots with `#![cfg(test)]`), where
# a failing test is the error message. Clippy has no such setting for `unreachable`, `todo` and `unimplemented`.
allow-print-in-tests = true
allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-panic-in-tests = true
allow-indexing-slicing-in-tests = true

# `std::thread::spawn` panics if the OS did not give a thread: threads are started through `thread::Builder::spawn` with the failure handled.
# In tests, use `#[allow(clippy::disallowed_methods)]` on the test or at the file root (clippy has no "in tests" setting for it).
disallowed-methods = [
    { path = "std::thread::spawn", reason = "panics if the OS refuses: use `thread::Builder::spawn` and handle the error" },
]
