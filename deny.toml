# cargo-deny: dependency licenses, known vulnerabilities (RustSec) and crate sources. Run by the `deny` job in ci.yml.
# Locally: cargo install cargo-deny && cargo deny check advisories licenses sources

[graph]
all-features = true

[advisories]
# What may be ignored here, and what may not (ADR-0012: security updates are not delayed):
# - "unmaintained": a crate with no maintained release to move to. If it is a direct dependency, the entry names the task that decides
#   its replacement. The Tauri entries are transitive dependencies on Linux that can be replaced only by updating Tauri and its plugins.
# - A vulnerability, only when all three hold, and the comment block above the entry says how each point was checked:
#   (1) the fix cannot be taken yet (for example the release is younger than the two-week rule of `src-tauri/Cargo.toml`);
#   (2) everywhere the crate appears in the graph (`cargo tree -i <crate> --target all`, the workspace and the spikes), the vulnerable
#       code is not compiled, or runs only on input that was authenticated first;
#   (3) the block names the release and the date that remove the entry.
#   A vulnerability whose code is reachable is never ignored: its fix is taken at once.
# - An ignore is by advisory id, so it covers every use of the crate. A new dependent on the crate needs the proof of (2) again.
# Every entry is reviewed when the crate that pulls it is updated, or by the date or task its comment names.
ignore = [
    { id = "RUSTSEC-2024-0370", reason = "proc-macro-error: via glib-macros -> gtk3-rs -> tray-icon/wry (Tauri, Linux only)" },
    { id = "RUSTSEC-2026-0370", reason = "zvariant: via zbus -> tauri-plugin-opener and tauri-plugin-single-instance (Linux only)" },
    { id = "RUSTSEC-2026-0371", reason = "zbus_names: via zbus (the same path as zvariant)" },
    { id = "RUSTSEC-2026-0372", reason = "zvariant_derive: via zbus (the same path as zvariant)" },
    # chrono is unmaintained (all versions; the advisory recommends jiff or time). CLAUDE.md (code style 6) mandates it for time and
    # dates, so it stays until an ADR picks a replacement: KINIG-119 decides it, and the three entries below are reviewed when it does.
    # chrono-tz (timezones for chrono, kinige-store) and humantime (object_store 0.14.2, kinige-server only) belong to the same
    # chronotope organization and were marked unmaintained with it; the latest releases of chrono, chrono-tz, humantime and object_store
    # are already in use, so no upgrade exists. None of the three is a vulnerability.
    { id = "RUSTSEC-2026-0543", reason = "chrono unmaintained: mandated by CLAUDE.md code style 6; KINIG-119 decides the replacement (jiff, time)" },
    { id = "RUSTSEC-2026-0555", reason = "chrono-tz unmaintained: timezone data of chrono in kinige-store; goes with KINIG-119" },
    { id = "RUSTSEC-2026-0542", reason = "humantime unmaintained: via object_store 0.14.2 in kinige-server (latest release); goes with KINIG-119" },
]

[licenses]
# Only licenses that permit distribution in a binary are allowed (rule 10 of CLAUDE.md for assets; the same goes for code).
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
    # target-lexicon (via tauri-build/tauri-utils): Apache-2.0 with the LLVM exception - puts no conditions on the binary.
    "Apache-2.0 WITH LLVM-exception",
    # clipboard-win, error-code (arboard, Windows only): Boost Software License - permissive, no copyleft.
    "BSL-1.0",
    # bip39, bitcoin_hashes (kinige-crypto, S4b): CC0-1.0 is a public-domain dedication, it puts no conditions on a binary.
    "CC0-1.0",
    # webpki-root-certs (kinige-server, S4c-2: object_store -> reqwest -> rustls-platform-verifier, TLS to an S3 store): the Mozilla root
    # certificate list as data. CDLA-Permissive-2.0 is permissive: redistribution with the notice, no copyleft on the program.
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8
# The list is shared by all platforms; an unused entry is not an error.
unused-allowed-license = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
