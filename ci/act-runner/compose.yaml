# Постоянный раннер Gitea Actions для Kinige: контейнер kinige-act-runner на ubuntu-server.
# Запуск (DOCKER_HOST уже указывает на ubuntu-server; токен — из Gitea: Настройки → Actions → Раннеры):
#   GITEA_RUNNER_REGISTRATION_TOKEN=<токен> docker compose -f ci/act-runner/compose.yaml -p kinige-act-runner up -d
# Токен не хранится в репозитории и не попадает в .env. Регистрация сохраняется в томе (/data/.runner),
# повторно токен используется только для проверки переменной. Проверено 19.10.2026: v0.6.1 регистрируется.
services:
  kinige-act-runner:
    container_name: kinige-act-runner
    image: gitea/act_runner:0.6.1
    restart: unless-stopped
    environment:
      GITEA_INSTANCE_URL: https://gitea.savvinov.me
      GITEA_RUNNER_REGISTRATION_TOKEN: ${GITEA_RUNNER_REGISTRATION_TOKEN:?нужен токен регистрации}
      GITEA_RUNNER_NAME: kinige-act-runner
      # Образ job — с Docker Hub: docker.gitea.com (Cloudflare) с ubuntu-server не скачивается, таймаут.
      # Метки запоминаются при регистрации (/data/.runner); после смены — поправить и там.
      GITEA_RUNNER_LABELS: ubuntu-latest:docker://gitea/runner-images:ubuntu-latest
    volumes:
      # Путь на самом ubuntu-server (не на Mac): раннер запускает job-контейнеры через его Docker.
      - /var/run/docker.sock:/var/run/docker.sock
      - kinige-act-runner-data:/data

volumes:
  kinige-act-runner-data:
