[workspace]
resolver = "3"
members = ["crates/kinige-domain", "crates/kinige-store", "crates/kinige-mcp", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "MIT"
publish = false

# `unsafe` — только в одной функции `effective_uid` (kinige-store, `geteuid`), с `#[allow]` и обоснованием (KINIG-28).
# `forbid` нельзя переопределить точечным `allow`, поэтому `deny`.
[workspace.lints.rust]
unsafe_code = "deny"

# Вывод только через крейт `log` (файл лога пишет tauri-plugin-log): в .app из Finder stderr никуда не попадает.
# В тестах и примерах печать разрешена (`clippy.toml`, `#![allow]` в examples).
#
# «Никогда не падать» (KINIG-28): ни одно из этих мест не должно попадать в код приложения. Исключение — доказуемо
# безошибочный литерал: `#[allow(clippy::expect_used)]` и `.expect("почему не может упасть")`. В тестах (unit в `src/`,
# корни `tests/` с `#![cfg(test)]`) и примерах разрешено (`clippy.toml`).
[workspace.lints.clippy]
print_stdout = "deny"
print_stderr = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unreachable = "deny"
todo = "deny"
unimplemented = "deny"

[profile.release]
lto = true
codegen-units = 1
# Без `panic = "abort"` (было до слайса 4a): паника в задаче писателя и в вызове инструмента MCP превращается в ошибку
# ответа через `catch_unwind` и приложение продолжает работать (ADR-0009). С abort это не работало бы.
strip = true
opt-level = "s"
