[workspace]
resolver = "3"
members = ["crates/kinige-domain", "crates/kinige-store", "crates/kinige-mcp", "crates/kinige-crypto", "src-tauri"]

[workspace.package]
# The only source of the app version (ADR-0012): tauri.conf.json has no version of its own, Tauri takes this one.
# web/package.json and the lock files repeat it; a mismatch is caught by web/src/version.test.ts. Changed by `scripts/release.sh`.
version = "0.9.0"
edition = "2024"
rust-version = "1.94"
license = "MIT"
publish = false

# `unsafe` only in one function, `effective_uid` (kinige-store, `geteuid`), with `#[allow]` and a justification (KINIG-28).
# `forbid` cannot be overridden by a targeted `allow`, hence `deny`.
[workspace.lints.rust]
unsafe_code = "deny"

# Output only through the `log` crate (the log file is written by tauri-plugin-log): in a .app started from Finder stderr goes nowhere.
# Printing is allowed in tests and examples (`clippy.toml`, `#![allow]` in examples).
#
# "Never panic" (KINIG-28): none of these may appear in the app code. The exception is a provably
# infallible literal: `#[allow(clippy::expect_used)]` and `.expect("why it cannot fail")`. Allowed in tests (unit in `src/`,
# `tests/` roots with `#![cfg(test)]`) and examples (`clippy.toml`).
[workspace.lints.clippy]
print_stdout = "deny"
print_stderr = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unreachable = "deny"
todo = "deny"
unimplemented = "deny"
# Indices and slice bounds come from foreign data: `get()` instead of `[i]` and `[a..b]`, string slices only on character
# boundaries. Indexing is allowed in tests, string slicing is not (`string_slice` has no such setting).
# `arithmetic_side_effects` is not enabled: 199 hits on counters and iterators without input data; lengths and offsets from
# input are checked by hand (`checked_*`, `saturating_*`), see KINIG-28.
indexing_slicing = "deny"
string_slice = "deny"

[profile.release]
lto = true
codegen-units = 1
# Without `panic = "abort"` (it was there before slice 4a): a panic in the writer task and in an MCP tool call turns into an error
# response through `catch_unwind` and the app keeps working (ADR-0009). With abort this would not work.
strip = true
opt-level = "s"

# libsodium (the C library, built by the build script of libsodium-sys-stable from the profile's flags, S4b): at the dev profile's
# `-O0` one Argon2id of profile 1 takes about 6 s and the tests of kinige-crypto take minutes. Optimized in every profile, so the
# measurement of profile 1 is the one the shipped app will see rather than that of `opt-level = "s"`.
[profile.dev.package.libsodium-sys-stable]
opt-level = 3
[profile.release.package.libsodium-sys-stable]
opt-level = 3
