[workspace]
resolver = "3"
members = ["crates/kinige-domain", "crates/kinige-store", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "MIT"
publish = false

# Вывод только через крейт `log` (файл лога пишет tauri-plugin-log): в .app из Finder stderr никуда не попадает.
# В тестах и примерах печать разрешена (`clippy.toml`, `#![allow]` в examples).
[workspace.lints.clippy]
print_stdout = "deny"
print_stderr = "deny"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
opt-level = "s"
